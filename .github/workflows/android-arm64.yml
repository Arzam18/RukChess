name: Build RukChess for Android ARM64 NEON

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: UCI build identity date (YYYYMMDD)
        required: true
        type: string
        default: '20261110'
      network_url:
        description: Optional URL for the original RukChess Net 183 / Epoch 111 file
        required: false
        type: string
        default: 'https://raw.githubusercontent.com/Ilya-Ruk/RukChessNets/master/Nets%20183/rukchess_111.nnue'

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 NEON engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UCI_DATE: ${{ inputs.uci_date }}
      RUKCHESS_NETWORK_URL: ${{ inputs.network_url }}
    steps:
      - name: Checkout newer upstream source
        uses: actions/checkout@v4

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate build date and install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UCI_DATE" =~ ^[0-9]{8}$ ]] || { echo "uci_date must be YYYYMMDD" >&2; exit 2; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1 || true)"
          fi
          [[ -x "$SDKMANAGER" ]] || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          # sdkmanager closes stdin early; ignore the expected yes/SIGPIPE status.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;27.2.12479018"
          set -o pipefail
          NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_HOME"
            echo "ANDROID_NDK_ROOT=$NDK_HOME"
            echo "UCI_DATE=$UCI_DATE"
          } >> "$GITHUB_ENV"

      - name: Download and validate original RukChess NNUE
        shell: bash
        run: |
          set -euo pipefail
          URL="${RUKCHESS_NETWORK_URL:-https://raw.githubusercontent.com/Ilya-Ruk/RukChessNets/master/Nets%20183/rukchess_111.nnue}"
          echo "Downloading RukChess Net 183 / Epoch 111"
          echo "Source: $URL"
          curl --fail --location --retry 4 --retry-delay 2 "$URL" --output net-7342fb032855.nnue
          BYTES="$(stat -c '%s' net-7342fb032855.nnue)"
          [[ "$BYTES" == '1579024' ]] || { echo "Unexpected NNUE size $BYTES (expected 1579024)." >&2; exit 1; }
          MAGIC="$(od -An -tx1 -N4 net-7342fb032855.nnue | tr -d ' \n')"
          [[ "$MAGIC" == '42524b52' ]] || { echo "Invalid NNUE magic: $MAGIC" >&2; exit 1; }
          sha256sum net-7342fb032855.nnue | tee rukchess-network.sha256

      - name: Build Android ARM64 NEON executable
        shell: bash
        run: bash ./scripts/build-android.sh

      - name: Build host reference and test embedded real NNUE through UCI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          mapfile -t SOURCES < <(find . -maxdepth 1 -type f -name '*.cpp' -printf '%f\n' | sort)
          cc -c scripts/embedded_nnue.S -o build/host/embedded_nnue.o
          g++ -std=gnu++17 -O3 -DNDEBUG -pthread -D__ANDROID__ \
            "-DRUKCHESS_BUILD_DATE=\"${UCI_DATE}\"" \
            -Wno-unknown-pragmas -Wno-deprecated-declarations -Wno-writable-strings \
            "${SOURCES[@]}" build/host/embedded_nnue.o -o build/host/RukChess
          python3 scripts/uci-smoke-test.py "$PWD/build/host/RukChess" "$UCI_DATE"

      - name: Upload self-contained Android engine
        uses: actions/upload-artifact@v4
        with:
          name: RukChess-Android-ARM64-NEON-${{ inputs.uci_date }}
          path: |
            dist/RukChess-Android-ARM64-NEON
            dist/BUILD_INFO.txt
            dist/SHA256SUMS.txt
            dist/readelf-header.txt
            dist/readelf-program-headers.txt
            dist/readelf-dynamic.txt
            dist/nnue2-disassembly.txt
            rukchess-network.sha256
          if-no-files-found: error
          retention-days: 30
